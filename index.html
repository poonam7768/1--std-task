<body class="bg-info">
    <h2 class="bg-dark text-center text-white">Student Form!!!</h2>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card mt-4">
                    <div class="card-body">
                        <form id="stdform">
                            <div class="form-group">
                                <label for="stdfName">Enter first Name:</label>
                                <input required type="text" id="stdfName" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="stdlName">Enter last Name:</label>
                                <input required type="text" id="stdlName" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="stdqualification">Enter Qualification:</label>
                                <input required type="text" id="stdqualification" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="stdphone">Enter Contact no.:</label>
                                <input required type="text" id="stdphone" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="stdemail">Enter Email:</label>
                                <input required type="text" id="stdemail" class="form-control">
                            </div>

                                <button type="submit" id="addbtn" class="btn btn-sm btn-block btn-primary">Add</button>
                                <button type="button" id="updatebtn" class="btn btn-sm btn-block btn-secondary d-none">Update</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <table class="table table-bordered text-center mt-4">
                    <thead>
                        <tr>
                            <th>sr.no.</th>
                            <th> First Name</th>
                            <th> Last Name</th>
                            <th> Qualification</th>
                            <th> Contact</th>
                            <th> Email</th>
                            <th> Edit</th>
                            <th> Delete</th>
                        </tr>
                    </thead>

                    <tbody id="stdcontainer">

                        </tr> -->
                    </tbody>
                  </table>
            </div>
        </div>
    </div>
<div class="spinner d-none" id="spinner">
